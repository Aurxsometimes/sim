name: Deploy SIM to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; a newer push cancels an older in-progress one
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-pnpm

      - name: Check that the keys are set
        env:
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
          WEB_OAUTH_CLIENT_ID: ${{ secrets.WEB_OAUTH_CLIENT_ID }}
          WEB_OAUTH_CLIENT_SECRET: ${{ secrets.WEB_OAUTH_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          missing=0
          # DIM_API_KEY is optional: without it SIM runs without DIM Sync (data saved per browser)
          for name in WEB_API_KEY WEB_OAUTH_CLIENT_ID WEB_OAUTH_CLIENT_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PROJECT; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set - run scripts/setup-secrets.ps1"; missing=1; fi
          done
          exit $missing

      - name: Build
        env:
          WEB_API_KEY: ${{ secrets.WEB_API_KEY }}
          WEB_OAUTH_CLIENT_ID: ${{ secrets.WEB_OAUTH_CLIENT_ID }}
          WEB_OAUTH_CLIENT_SECRET: ${{ secrets.WEB_OAUTH_CLIENT_SECRET }}
          DIM_API_KEY: ${{ secrets.DIM_API_KEY }}
          # Cloudflare compresses files itself, so skip making .br copies
          PR_BUILD: '1'
          CI: 'true'
        run: |
          export VERSION="$(node -p "require('./package.json').version").${GITHUB_RUN_NUMBER}"
          pnpm build:release

      - name: Prepare for Cloudflare Pages
        run: |
          # With no 404.html, Cloudflare Pages treats the site as a single-page app and
          # serves index.html for deep links (e.g. /1234/d2/inventory).
          rm -f dist/404.html
          # Source maps are large and only useful for debugging; Cloudflare caps file counts/sizes
          find dist -name '*.map' -delete
          # Destiny 1 data (one file is 44 MB, over Cloudflare's 25 MB limit). SIM is Destiny 2 only.
          rm -rf dist/data/d1
          # Fail early with a clear message if anything else is too big for Cloudflare
          big="$(find dist -type f -size +25M)"
          if [ -n "$big" ]; then echo "::error::Files over Cloudflare's 25 MB limit: $big"; exit 1; fi

      - name: Set up storage for short loadout links
        # Finds or creates the "sim-shares" KV namespace and connects it to the site's functions
        # (functions/). If the token can't use KV, the site still deploys; sharing then falls
        # back to longer self-contained links.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id="$(curl -sS -H "$auth" "$api?per_page=100" | jq -r '.result // [] | .[] | select(.title=="sim-shares") | .id' | head -n1)"
          if [ -z "$id" ]; then
            id="$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' -d '{"title":"sim-shares"}' "$api" | jq -r '.result.id // empty')"
          fi
          if [ -z "$id" ]; then
            echo "::warning::Short loadout links are off: the Cloudflare token needs 'Workers KV Storage: Edit'. Sharing uses longer links until then."
            exit 0
          fi
          cat > wrangler.toml <<EOF
          name = "$CLOUDFLARE_PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2025-01-01"

          [[kv_namespaces]]
          binding = "SHARES"
          id = "$id"
          EOF
          echo "Short loadout links use KV namespace $id"

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main --commit-dirty=true
